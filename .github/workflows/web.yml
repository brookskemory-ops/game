name: Web Build & Deploy

# Exports the Godot project for the web and publishes it to the gh-pages
# branch, which GitHub serves automatically at
#   https://brookskemory-ops.github.io/game/
# giving a play-in-browser test link on every push to the dev branch.
# The web export uses thread_support=false so it runs on Pages and mobile
# browsers without cross-origin-isolation headers.

on:
  push:
    branches:
      - claude/narrative-roguelike-medieval-design-34nvrc
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate & export web build
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import project
        run: godot --headless --import || true

      # Boot both scenes headless: this compiles every script WITH autoloads
      # registered (--check-only can't do that) and catches crashes at startup.
      # The arena run simulates ~2s of real gameplay.
      - name: Validate scenes boot cleanly
        shell: bash
        run: |
          fail=0
          for scene in res://scenes/main.tscn res://scenes/camp.tscn res://scenes/arena.tscn; do
            echo "--- booting $scene ---"
            out=$(godot --headless --quit-after 120 "$scene" 2>&1 || true)
            echo "$out"
            if echo "$out" | grep -qE "SCRIPT ERROR|Failed to load script|Parse Error"; then
              echo "::error::Script errors while booting $scene"
              fail=1
            fi
          done
          exit $fail

      # Booting the arena only exercises the default loadout. This loads and
      # instantiates EVERY weapon script so a draftable weapon that parses but
      # fails to load at runtime (untyped-Variant inference, etc.) fails CI
      # instead of shipping as a silently-dead weapon.
      - name: Validate every weapon script loads
        shell: bash
        run: |
          out=$(timeout 90 godot --headless --quit-after 20 --script res://tools/check_weapons.gd 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -qE "check_weapons: OK"; then
            exit 0
          fi
          echo "::error::One or more weapon scripts failed to load/instantiate (or the check timed out)"
          exit 1

      # The containerized job runs with HOME=/github/home, so the image's
      # preinstalled templates are invisible — and we need the *nothreads*
      # web templates (runs on Pages/mobile browsers without COOP/COEP
      # headers), which the image doesn't ship. Fetch once, cache forever.
      - name: Cache web export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: /github/home/.local/share/godot/export_templates/4.4.1.stable
          key: godot-4.4.1-web-nothreads-v1

      - name: Install nothreads web templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        shell: bash
        run: |
          url="https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"
          if command -v wget >/dev/null 2>&1; then
            wget -q -O /tmp/templates.tpz "$url"
          elif command -v curl >/dev/null 2>&1; then
            curl -sSL -o /tmp/templates.tpz "$url"
          else
            apt-get update -qq && apt-get install -y -qq wget
            wget -q -O /tmp/templates.tpz "$url"
          fi
          cd /tmp
          unzip -o templates.tpz "templates/web_nothreads_*"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp templates/web_nothreads_* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          ls -la "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          touch build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true
          commit_message: "Deploy web build"

      # GitHub Pages for this repo is locked to the default branch (its
      # source can only be changed from repo settings, which we can't reach),
      # so also publish the build into /web on this branch. The 44MB engine
      # wasm only changes on Godot upgrades; routine deploys rewrite only the
      # small data pack, so history stays lean. [skip ci] prevents a loop.
      - name: Publish build to /web on this branch (served by Pages)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$(pwd)"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          rm -rf web
          mkdir web
          cp -r build/web/. web/
          git add -f web
          if git diff --cached --quiet; then
            echo "Web build unchanged — nothing to publish."
            exit 0
          fi
          git commit -m "Publish web build to /web [skip ci]"
          for i in 1 2 3; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then exit 0; fi
            git pull --rebase origin ${GITHUB_REF_NAME}
          done
          git push origin HEAD:${GITHUB_REF_NAME}

  # PC is the first release target: build self-contained Linux and Windows
  # executables and upload them as workflow artifacts (itch.io / Steam ready).
  # Runs in parallel with the web build; does not gate the Pages deploy.
  desktop:
    name: Export desktop builds (Linux + Windows)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import project
        run: godot --headless --import || true

      # Same template-visibility problem as the web job (HOME=/github/home):
      # fetch the standard export templates and drop in the desktop ones.
      - name: Cache desktop export templates
        id: cache-desktop
        uses: actions/cache@v4
        with:
          path: /github/home/.local/share/godot/export_templates/4.4.1.stable
          key: godot-4.4.1-desktop-v1

      - name: Install desktop templates
        if: steps.cache-desktop.outputs.cache-hit != 'true'
        shell: bash
        run: |
          url="https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"
          if command -v wget >/dev/null 2>&1; then
            wget -q -O /tmp/templates.tpz "$url"
          else
            apt-get update -qq && apt-get install -y -qq wget
            wget -q -O /tmp/templates.tpz "$url"
          fi
          cd /tmp
          unzip -o templates.tpz "templates/linux_*" "templates/windows_*"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp templates/linux_* templates/windows_* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          ls -la "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Export Linux
        shell: bash
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux" build/linux/vigil.x86_64
          chmod +x build/linux/vigil.x86_64
          ls -la build/linux

      - name: Export Windows
        shell: bash
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/vigil.exe
          ls -la build/windows

      # Smoke-test the Linux export the same way we boot the project headless:
      # run the real exported binary for ~2s and fail on any script error.
      - name: Smoke-test Linux build
        shell: bash
        run: |
          out=$(./build/linux/vigil.x86_64 --headless --quit-after 120 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -qE "SCRIPT ERROR|Failed to load script|Parse Error"; then
            echo "::error::Script errors in the exported Linux build"
            exit 1
          fi

      - name: Package Linux
        shell: bash
        run: |
          cd build/linux && zip -r ../../vigil-linux.zip . && cd ../..

      - name: Package Windows
        shell: bash
        run: |
          cd build/windows && zip -r ../../vigil-windows.zip . && cd ../..

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: vigil-linux
          path: vigil-linux.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: vigil-windows
          path: vigil-windows.zip

  # The Pages site exists in "GitHub Actions" mode (branch pushes never
  # rebuild it), so deploy the artifact directly. The earlier failure was
  # only at site *creation* — deploying to the existing site works with
  # the standard pages permissions.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages deployments rate-limit (~10/hour) and fail with a transient
      # "try again later" — wait it out and retry twice before giving up.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 120

      - name: Deploy (retry 1)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before final retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 240

      - name: Deploy (retry 2)
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
